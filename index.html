<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO. Each page overrides these at runtime via <Seo /> -->
    <title>Digitner | Digital transformation and AI solutions</title>
    <meta name="description" content="Digitner builds websites, mobile apps, CRMs, WhatsApp automation and AI agents. See a working prototype before you sign. Learn. Build. Grow. Now with AI." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#5B54C4" />
    <!-- Apply saved theme before first paint (light is the default) -->
    <script>
      try {
        var t = localStorage.getItem('digitner-theme') || 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="canonical" href="https://digitner.com/" />

    <!-- Icons / manifest -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter -->
    <meta property="og:site_name" content="Digitner" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://digitner.com/" />
    <meta property="og:title" content="Digitner | Digital transformation and AI solutions" />
    <meta property="og:description" content="Websites, apps, CRMs, WhatsApp automation and AI agents. See a working prototype before you sign." />
    <meta property="og:image" content="https://digitner.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Digitner: Digital transformation and AI solutions" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digitner | Digital transformation and AI solutions" />
    <meta name="twitter:description" content="Websites, apps, CRMs, WhatsApp automation and AI agents. See a working prototype before you sign." />
    <meta name="twitter:image" content="https://digitner.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Digitner",
        "legalName": "Digitner Tech Solutions Pvt. Ltd.",
        "url": "https://digitner.com",
        "logo": "https://digitner.com/favicon.png",
        "slogan": "Learn. Build. Grow. Now with AI.",
        "foundingDate": "2025",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "408/A2B, Ragavendra, Kilithampattrai",
          "addressLocality": "Vellore",
          "postalCode": "632007",
          "addressCountry": "IN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Digitner needs JavaScript enabled to run this site.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
