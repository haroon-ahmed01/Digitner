<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden}</style><title>Global Delight Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

/* Layout: fixed left rail + scrolling work area; each main page opens with a purple "plate" hero, then working content. Dark-first. */
:root{
  --bg:#0e0c16;--panel:#16131f;--panel2:#1d1929;--line:#2a253a;--fg:#ece9f7;--muted:#a49ebb;--faint:#6e6886;
  --brand:#4C3ABE;--accent:#8B7CF0;--accent-fg:#120b2e;--btn:#4F43D4;--btn-fg:#ffffff;--tint:#241d45;
  --plate-a:#2A1A66;--plate-b:#4F31A1;--plate-fg:#f4f1ff;--plate-muted:#c3b8ef;
  --ok:#4ade80;--ok-soft:#14301f;--warn:#fbbf24;--warn-soft:#33270f;--bad:#f87171;--bad-soft:#3a1717;
  --f-d:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--f-b:Inter,ui-sans-serif,system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f6fc;--panel:#ffffff;--panel2:#f1eefa;--line:#e2ddf2;--fg:#1a1630;--muted:#655f80;--faint:#9893ad;
  --accent:#4C3ABE;--accent-fg:#ffffff;--tint:#EEEBFB;--ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:256px 1fr;height:100%}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:16px 16px 8px;display:flex;flex-direction:column;gap:4px}
.brand img{height:28px;width:auto;align-self:flex-start}
.brand small{font-family:var(--f-m);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.logo-dark{display:block}.logo-light{display:none}
:root[data-theme="light"] .logo-dark{display:none}:root[data-theme="light"] .logo-light{display:block}
.search{margin:6px 12px 6px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2);color:var(--muted);width:calc(100% - 24px);text-align:left}
.kbd{font-family:var(--f-m);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}
.nav{overflow-y:auto;flex:1;padding:0 8px 12px}
.sec{font-family:var(--f-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 8px 4px;display:flex;justify-content:space-between}
.ni{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;border-radius:7px;padding:5px 8px;color:var(--fg)}
.ni:hover{background:var(--panel2)}
.ni.on{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.ni .code{font-family:var(--f-m);font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;width:24px;text-align:center;flex:none}
.ni .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ni .cnt{font-family:var(--f-m);font-size:10px;color:var(--muted)}
.ni .badge{font-family:var(--f-m);font-size:10px;background:var(--btn);color:#fff;border-radius:9px;padding:0 6px}
.bar{height:4px;background:var(--line);border-radius:4px;width:46px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent)}
.me{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.me .who{min-width:0;flex:1}.me b{display:block;font-size:13px}.me small{color:var(--muted);font-size:11px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;background:var(--btn);color:#fff;flex:none;font-family:var(--f-m)}
.av.ag{background:var(--tint);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.av.sm{width:22px;height:22px;font-size:9px}
.av.lg{width:52px;height:52px;font-size:16px;border-radius:12px}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;color:var(--muted)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumbs{display:flex;gap:6px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--fg);font-weight:500}
.menu-btn{display:none}
.banner{display:flex;gap:10px;align-items:center;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px 20px;background:var(--warn-soft);font-size:12.5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.banner b{color:var(--warn)}
.banner button{margin-left:auto}
.scroll{overflow-y:auto;flex:1;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px 20px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* plate */
.plate{position:relative;border-radius:14px;overflow:hidden;color:var(--plate-fg);padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;
  background:radial-gradient(90% 120% at 90% 0%,color-mix(in srgb,var(--btn) 70%,transparent) 0,transparent 60%),linear-gradient(150deg,var(--plate-a) 10%,var(--plate-b) 100%)}
.plate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 8px);pointer-events:none}
.plate>*{position:relative;min-width:0}
.tag{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:3px 8px;color:var(--plate-muted)}
.tag .i{color:var(--plate-fg)}
.plate h1{font-family:var(--f-d);font-weight:600;font-size:clamp(25px,3.4vw,36px);line-height:1.1;margin:14px 0 10px;text-wrap:balance;letter-spacing:-.01em}
.plate h1 span{color:var(--plate-muted);font-weight:500;display:block}
.plate p{color:var(--plate-muted);max-width:58ch;margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(118px,1fr));border:1px solid rgba(255,255,255,.18);border-radius:10px;overflow:hidden;background:rgba(10,4,30,.35)}
.stats div{padding:10px 14px;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.stats div:nth-child(2n){border-right:0}.stats div:nth-last-child(-n+2){border-bottom:0}
.stats b{display:block;font-family:var(--f-d);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stats small{font-size:11.5px;color:var(--plate-muted)}
/* buttons */
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.pri:hover{background:var(--brand)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.plate .btn{background:#fff;color:#1a1630;border-color:#fff}
.plate .btn.ghost{background:rgba(255,255,255,.1);color:var(--plate-fg);border-color:rgba(255,255,255,.3)}
.link{color:var(--accent);background:none;border:0;padding:0;font-weight:500}
/* text */
.h2{font-family:var(--f-d);font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.h2 span{color:var(--faint);font-weight:500}
.sub{color:var(--muted);margin:2px 0 0}
.eyebrow{font-family:var(--f-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--f-m);font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-m);font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--tint);color:var(--accent);border-color:transparent}
/* blocks */
.next{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--panel);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.next .grow{flex:1;min-width:220px}
.next b{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
a.card:hover,button.card:hover{border-color:var(--accent)}
.strip{height:56px;background:linear-gradient(135deg,var(--plate-a),var(--plate-b));position:relative}
.strip .av{position:absolute;left:14px;bottom:-15px;width:36px;height:36px;border:2px solid var(--panel);background:var(--tint)}
.card .body{padding:22px 14px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:15px;font-family:var(--f-d);font-weight:600}
.card .led{color:var(--muted);font-size:12.5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.nums div{padding:8px 14px}
.nums b{font-family:var(--f-d);font-size:18px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
.nums small{font-family:var(--f-m);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.agent-card{padding:14px;gap:8px}
.agent-card .ini{font-family:var(--f-d);font-size:30px;color:var(--faint);line-height:1}
.agent-card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:200px}
.row .grow b{display:block;font-weight:500}
.row .grow small{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 11px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--f-m);color:var(--faint)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on small{color:var(--bg);opacity:.7}
/* room */
.room{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;gap:14px;min-width:0}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .bub{min-width:0;flex:1}
.msg .who{font-weight:600;font-size:13px}.msg .who small{color:var(--faint);font-weight:400;margin-left:6px}
.msg h2{font-family:var(--f-d);font-weight:600;font-size:24px;margin:2px 0 6px}
.msg p{margin:0 0 6px;color:var(--muted);max-width:70ch}
.msg.user .bub{background:var(--tint);border-radius:10px;padding:8px 12px}
.msg.user p{color:var(--fg)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:6px}
.act{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;text-align:left}
.act:hover{border-color:var(--accent)}
.composer{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.composer .tb{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.composer .tb span{padding:2px 6px;border-radius:4px}
.composer form{display:flex;gap:8px;padding:8px}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:transparent;min-height:44px;min-width:0}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.task .mv{display:flex;justify-content:space-between}
/* levels */
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lvl{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.lvl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lvl b{font-family:var(--f-d);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.lvl em{font-style:normal;font-size:11.5px;color:var(--muted)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-family:var(--f-m);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--panel2)}
tr.sel td{background:var(--tint)}
.who-cell{display:flex;gap:10px;align-items:center}
.who-cell small{display:block;color:var(--muted);font-size:12px}
.split{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
/* forms */
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{font-family:var(--f-m);font-size:11px;color:var(--faint);width:22px;padding-top:2px}
.step .grow{flex:1;min-width:0}
.step p{margin:2px 0 0;color:var(--muted)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;padding:0;font-size:12px}
.check.on{background:var(--btn);border-color:var(--btn);color:#fff}
.toggle{width:36px;height:20px;border-radius:20px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--btn)}.toggle.on::after{left:19px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.skill{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.skill .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.skill p{margin:0;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.form{display:flex;flex-direction:column;gap:14px}
.savebar{position:sticky;bottom:-80px;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.savebar span{flex:1;color:var(--muted);font-size:12.5px;min-width:160px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2)}
details summary{cursor:pointer;font-weight:500}
details ol{margin:10px 0 4px;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;background:var(--panel);text-align:left;min-width:0}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt p{margin:2px 0 0;color:var(--muted)}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,3,12,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(10vh + env(safe-area-inset-top,0px)) 16px 16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:80vh;overflow:auto;display:flex;flex-direction:column}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-family:var(--f-d);font-size:18px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pal input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 18px;font-size:16px;outline:0;width:100%}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:7px}
.pal .res button.on,.pal .res button:hover{background:var(--tint)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:35;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.drawer form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.drawer input{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px;min-width:0}
.ask{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:6px 14px 6px 6px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.i{flex:none;display:inline-block;vertical-align:-3px}
.ni .i{color:var(--muted)}.ni.on .i{color:var(--accent)}
.h2 .i{color:var(--accent);margin-right:8px;vertical-align:-2px}
.opt>.i{color:var(--accent);margin-top:2px}

function reach(){const sel=SEGMENTS.filter(s=>S.segs.has(s.id));const overlap=sel.length>1?Math.round(sel.reduce((a,s)=>a+s.c,0)*0.056):0;
 const sup=Math.round(sel.reduce((a,s)=>a+s.c,0)*0.06);
 const total=sel.reduce((a,s)=>a+s.c,0)-overlap;
 const em=Math.max(0,sel.reduce((a,s)=>a+s.em,0)-overlap-Math.round(sup*.55));
 const wa=Math.max(0,sel.reduce((a,s)=>a+s.wa,0)-Math.round(overlap*.7)-Math.round(sup*.45));
 return{total,overlap,sup,em,wa}}
function results(){const r=reach();const del=Math.round(r.em*.982),open=Math.round(del*.452),click=Math.round(del*.097),uns=Math.round(del*.0036);

 const enq=Math.round((click+btn)*.32),quotes=Math.round(enq*.62),book=Math.round(quotes*.31),rev=book*168000;
 return{r,del,open,click,uns,wdel,read,btn,expert,stop,enq,quotes,book,rev,credits:Math.round((r.em+r.wa)*.11)}}

function payImpact(p){const r=p.st==="open"?FX[p.c].r:p.lock;return{rate:r,inr:p.a*r,diff:p.a*(r-p.booked)}}
function fxOpen(){return S.fx.pay.filter(p=>p.st==="open")}
function fxOpenCount(){return S.inbox.filter(i=>i.fx).length}
function fxPending(id){return S.inbox.some(i=>i.fx&&i.fx.id===id)}
function fxSuggest(p){if(p.st!=="open")return null;if(p.days<=10)return"pay";if(payImpact(p).diff>0||FX[p.c].w>0)return"lock";return"watch"}
function fxApply(f){const p=S.fx.pay.find(x=>x.id===f.id);if(!p)return;p.lock=f.rate;p.st=f.act==="lock"?"locked":"paid";S.fx.runs++;
 log("RUPA",`${f.act==="lock"?"Booked forward":"Paid supplier"}: ${p.c} ${num(p.a)} at ${rt(f.rate)} for ${p.tour.split(" · ")[0]}`)}
function fxAsk(id,act){const p=S.fx.pay.find(x=>x.id===id);if(fxPending(id)){location.hash="inbox";return}
 const rate=act==="lock"?fwd(p.c,p.days):FX[p.c].r*1.002;
 S.inbox.push({id:S.nextId++,t:`${act==="lock"?"Lock":"Pay"} ${p.c} ${num(p.a)} at ${rt(rate)} · ${p.sup}${act==="lock"?` (forward, ${p.days} days)`:""}`,k:act==="lock"?"FX lock":"FX payment",at:"Today "+now(),go:"fxpay",av:"RU",by:"RUPA",fx:{id,act,rate}});
 log("RUPA",`Asked Karthik to ${act} ${p.c} ${num(p.a)} for ${p.sup}`);rerender();toast("Added to Inbox for your approval")}

<script>(function(){
if(window.__fdDock)return;window.__fdDock=1;
var mq=matchMedia("(max-width:900px)");
var SEL=".stepper,.tabs,#teambar";
var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>';
var X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var CARET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(g){
  if(g.classList.contains("stepper"))return[].slice.call(g.querySelectorAll(".stp"));
  if(g.id==="teambar")return[].slice.call(g.querySelectorAll(".tp")).filter(function(x){return!x.classList.contains("add")});
  return[].slice.call(g.querySelectorAll("button"));
}
function kind(g){
  if(g.classList.contains("stepper"))return{k:"step",title:"Steps",tip:"Switch steps",o:0};
  if(g.id==="teambar")return{k:"jump",title:"Jump to",tip:"Quick switch",o:3};
  var b=g.querySelector("button"),a=b&&b.getAttribute("data-a");
  if(a==="tplTab")return{k:"tpl",title:"Template",tip:"Switch template",o:2};
  return{k:"view",title:"View",tip:"Change view",o:1};
}
function label(b){var c=b.cloneNode(true);[].forEach.call(c.querySelectorAll("i,svg,.i,.pill,.tag,.av,.badge,.dot"),function(x){x.remove()});return(c.textContent||"").replace(/\s+/g," ").trim()}
function note(b){var n=b.querySelector(".pill,.tag");return n?(n.textContent||"").trim():""}
function isOn(b){return b.classList.contains("on")||b.getAttribute("aria-selected")==="true"||b.getAttribute("aria-current")==="page"}
function live(){return[].slice.call(document.querySelectorAll(SEL)).filter(function(g){return!g.closest(".fd-sheet")&&opts(g).length>1}).sort(function(a,b){return kind(a).o-kind(b).o})}
var fab,tip,scrim,sheet,body,lastFocus,obs,busy=false,tipTimer;
function build(){
  if(fab)return;
  fab=document.createElement("button");fab.className="fd-fab";fab.type="button";fab.hidden=true;fab.setAttribute("aria-haspopup","dialog");fab.innerHTML=ICON;
  tip=document.createElement("div");tip.className="fd-tip";tip.hidden=true;tip.setAttribute("role","status");
  scrim=document.createElement("div");scrim.className="fd-scrim";
  sheet=document.createElement("section");sheet.className="fd-sheet";sheet.setAttribute("role","dialog");sheet.setAttribute("aria-modal","true");sheet.setAttribute("aria-label","Filters");
  sheet.innerHTML='<div class="fd-grip"></div><div class="fd-head"><b>Filters</b><button class="fd-x" type="button" aria-label="Close">'+X+'</button></div><div class="fd-body"></div>';
  body=sheet.querySelector(".fd-body");
  document.body.appendChild(fab);document.body.appendChild(tip);document.body.appendChild(scrim);document.body.appendChild(sheet);
  fab.addEventListener("click",function(){openSheet()});
  scrim.addEventListener("click",closeSheet);
  sheet.querySelector(".fd-x").addEventListener("click",closeSheet);
  addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet.classList.contains("open"))closeSheet()});
  body.addEventListener("click",function(e){
    var o=e.target.closest(".fd-opt");if(!o)return;
    var gs=live(),g=gs[+o.getAttribute("data-g")],bs=g&&opts(g),t=bs&&bs[+o.getAttribute("data-b")];

  });

function fill(){
  var gs=live(),h="";

    var kd=kind(g);h+='<div class="fd-gt">'+kd.title+'</div>';
    opts(g).forEach(function(b,bi){
      var on=isOn(b),done=b.classList.contains("done"),nt=note(b),num=kd.k==="step"?(done?"✓":bi+1):(on?"✓":"");
      h+='<button type="button" class="fd-opt'+(on?" on":"")+(done?" done":"")+'" data-g="'+gi+'" data-b="'+bi+'"'+(on?' aria-current="true"':"")+'>'+(num!==""?'<span class="fd-n">'+num+'</span>':'<span class="fd-n"></span>')+'<span class="fd-t">'+esc(label(b))+'</span>'+(nt?'<span class="fd-note">'+esc(nt)+'</span>':"")+'</button>';
    });
  });
  body.innerHTML=h;
}
function openSheet(){
  fill();lastFocus=document.activeElement;
  tip.classList.remove("on");
  scrim.classList.add("open");sheet.classList.add("open");
  var a=body.querySelector(".fd-opt.on")||body.querySelector(".fd-opt");
  if(a){a.focus({preventScroll:true});a.scrollIntoView({block:"center"})}
}
function closeSheet(){
  scrim.classList.remove("open");sheet.classList.remove("open");
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}
}
function seenKey(k){return"dl-fd-seen-"+k}
function maybeTip(k,text){
  var seen=false;try{seen=localStorage.getItem(seenKey(k))==="1"}catch(e){}
  tip.textContent=text;tip.setAttribute("data-k",k);
  if(seen||tip.getAttribute("data-shown")===k)return;
  tip.setAttribute("data-shown",k);
  try{localStorage.setItem(seenKey(k),"1")}catch(e){}
  clearTimeout(tipTimer);
  setTimeout(function(){tip.classList.add("on");tipTimer=setTimeout(function(){tip.classList.remove("on")},5000)},500);

function chipText(g){
  var kd=kind(g),bs=opts(g),i=0;bs.forEach(function(b,n){if(isOn(b))i=n});

}
function sync(){
  if(busy)return;busy=true;obs&&obs.disconnect();
  try{
    build();
    var on=mq.matches,gs=on?live():[];
    [].forEach.call(document.querySelectorAll(".fd-chip"),function(c){var n=c.nextElementSibling;if(!on||!n||!n.hasAttribute("data-fd"))c.remove()});
    [].forEach.call(document.querySelectorAll("[data-fd]"),function(g){if(!on)g.removeAttribute("data-fd")});
    gs.forEach(function(g){
      g.setAttribute("data-fd","1");
      if(g.id==="teambar")return;
      var c=g.previousElementSibling;
      if(!c||!c.classList||!c.classList.contains("fd-chip")){
        c=document.createElement("button");c.type="button";c.className="fd-chip";
        c.addEventListener("click",function(){openSheet()});
        g.parentNode.insertBefore(c,g);
      }
      var h=chipText(g)+CARET;if(c.innerHTML!==h)c.innerHTML=h;
    });
    var show=on&&gs.length>0;
    fab.hidden=!show;
    fab.setAttribute("aria-label",show?kind(gs[0]).tip+" (filters)":"Filters");
    var app=document.querySelector(".app");document.body.classList.toggle("fd-menu",!!(app&&app.classList.contains("open")));
    if(show){tip.hidden=false;maybeTip(kind(gs[0]).k,kind(gs[0]).tip)}else{tip.hidden=true}

}
var raf=0;
function watch(){
  if(!obs){obs=new MutationObserver(function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(sync)})}
  obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class","aria-selected","aria-current"]});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",sync);else sync();
addEventListener("hashchange",function(){setTimeout(sync,80)});
})();
